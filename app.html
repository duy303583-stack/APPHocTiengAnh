<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6366f1">
  <title>EngMate – Học tiếng Anh thông minh</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="js/demo-switcher.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="#/profile" class="brand">
      <div class="avatar" id="avatar" aria-hidden="true">🤓</div>
      <div style="min-width:0"><div class="user-name" id="userName">EngMate</div><div class="user-level" id="userLevel">Lộ trình A1 – C2</div></div>
    </a>
    <div class="stats" id="topStats"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/home" data-tab="home"><i class="fa-solid fa-house" aria-hidden="true"></i>Trang chủ</a>
    <a href="#/path" data-tab="path"><i class="fa-solid fa-book-open" aria-hidden="true"></i>Lộ trình</a>
    <a href="#/chat" data-tab="chat"><i class="fa-solid fa-robot" aria-hidden="true"></i>Gia sư AI</a>
    <a href="#/review" data-tab="review"><i class="fa-solid fa-comment-dots" aria-hidden="true"></i>Ôn tập</a>
    <a href="#/profile" data-tab="profile"><i class="fa-solid fa-trophy" aria-hidden="true"></i>Thành tích</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/prompts.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
