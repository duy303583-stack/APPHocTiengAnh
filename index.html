<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6366f1">
  <title>EngMate – Học tiếng Anh thông minh</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script>
    // Cổng vào duy nhất của app: mở đúng giao diện người dùng đã chọn trong Cài đặt (mặc định: app chính).
    (() => {
      const PAGES = { app: 'app.html', 'ai-tutor': 'ai-tutor.html', demo01: 'demo01.html', demo02: 'demo02.html', demo03: 'demo03.html' };
      let ui = 'app';
      try { ui = localStorage.getItem('engmate-ui') || 'app'; } catch { /* trình duyệt chặn lưu trữ: dùng mặc định */ }
      location.replace((PAGES[ui] || PAGES.app) + location.hash);
    })();
  </script>
  <style>body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f0f4f8; color: #1e293b; }</style>
</head>
<body>
  <p>Đang mở EngMate… <a href="app.html">Bấm vào đây nếu trang không tự chuyển</a>.</p>
</body>
</html>
